{% set version = "8.5" %}
{% set name = "pyobjc-framework-Cocoa" %}

package:
  name: pyobjc-framework-cocoa
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: b18d05e7a795a3455ad191c3e43d6bfa673c2a4fd480bb1ccf57191051b80b7e

build:
  number: 0
  script:
    - export CFLAGS="${CFLAGS} -isysroot ${SDKROOT:-$CONDA_BUILD_SYSROOT}"
    # force ignoring invalid compiler flag (-Wl,-export-dynamic)
    - export CFLAGS="${CFLAGS} -Wno-unused-command-line-argument"  # [py == 37 or py == 38]
    - {{ PYTHON }} -m pip install . -vv
  skip: true  # [(not osx) or py<36 or (arm64 and py < 38)]

requirements:
  build:
    - {{ compiler('c') }}
  host:
    - python
    - libffi
    - pip
    - setuptools
    - wheel
  run:
    - python
    - pyobjc-core {{ version }}
    - libffi

test:
  requires:
    - pip
  commands:
    - pip check
  imports:
    - AppKit
    - Cocoa
    - CoreFoundation
    - Foundation
    - PyObjCTools

about:
  home: https://github.com/ronaldoussoren/pyobjc
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: Wrappers for the Cocoa frameworks on Mac OS X
  doc_url: https://pyobjc.readthedocs.io/en/latest/
  dev_url: https://github.com/ronaldoussoren/pyobjc

extra:
  recipe-maintainers:
    - leofang
    - jschueller
