{% set version = "12.0" %}
{% set name = "pyobjc-framework-Cocoa" %}

package:
  name: pyobjc-framework-cocoa
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/p/pyobjc-framework-Cocoa/pyobjc_framework_cocoa-12.0.tar.gz
  sha256: 02d69305b698015a20fcc8e1296e1528e413d8cf9fdcd590478d359386d76e8a
  patches:
    - fix-uninitialize-var.patch

build:
  number: 0
  script:
    - export CFLAGS="${CFLAGS} -isysroot ${SDKROOT:-$CONDA_BUILD_SYSROOT}"
    # force ignoring invalid compiler flag (-Wl,-export-dynamic)
    - export CFLAGS="${CFLAGS} -Wno-unused-command-line-argument"  # [py == 37 or py == 38]
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [(not osx) or py<39]

requirements:
  build:
    - {{ compiler('c') }}
    - patch
  host:
    - python
    - pip
    - setuptools
    - wheel
    - libffi {{ libffi }}
  run:
    - python
    - pyobjc-core >=12.0
    - libffi

test:
  requires:
    - pip
  commands:
    - pip check
  imports:
    - AppKit
    - Cocoa
    - CoreFoundation
    - Foundation
    - PyObjCTools

about:
  home: https://github.com/ronaldoussoren/pyobjc
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: Wrappers for the Cocoa frameworks on Mac OS X
  description: |
    Wrappers for framework 'Cocoa', that is frameworks 'CoreFoundation',
    'Foundation' and 'AppKit'.
  doc_url: https://pyobjc.readthedocs.io
  dev_url: https://github.com/ronaldoussoren/pyobjc

extra:
  recipe-maintainers:
    - xhochy
    - jschueller
